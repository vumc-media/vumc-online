<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VUMC Watch Live</title>

<script src="https://js.churchcenter.com/modal/v1"></script>

<style>
body{
  margin:0;
  background:#0f1115;
  color:#fff;
  font-family:Arial, Helvetica, sans-serif;
}

#playerWrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
}

iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

.vumcHidden{
  display:none!important;
}

#chatLiveWrap,
#chatClosedWrap{
  padding:20px;
}
</style>
</head>

<body>

<div id="playerWrap">
  <iframe
    src="https://www.youtube.com/embed/live_stream?channel=UC_svgodM3blLqWEBQ5yNjmA&autoplay=1&mute=1&rel=0&playsinline=1"
    title="Versailles UMC Live"
    allow="autoplay; encrypted-media; picture-in-picture; web-share"
    allowfullscreen>
  </iframe>
</div>

<div id="chatLiveWrap" class="vumcHidden">
  <h3>Live Chat</h3>
  <div id="chatMessages"></div>
</div>

<div id="chatClosedWrap">
  <h3>Chat Opens During Worship</h3>
</div>

<script>
const CHAT_BACKEND_URL = "https://script.google.com/macros/s/AKfycbzWN8Xi7xUFa_gjg4XHuD_yEEkaKLwrnXFI8d_XQMW4-KQRUlVPVmxcjfcgC0gMNMewsg/exec";

const FORCE_CHAT_OPEN_FOR_TESTING = false;

let isActuallyLive = false;

function isSundayServiceWindow(){
  const now = new Date();
  const day = now.getDay();
  const minutes = now.getHours() * 60 + now.getMinutes();
  return day === 0 && minutes >= 570 && minutes <= 720;
}

function shouldOpenLiveChat(){
  return FORCE_CHAT_OPEN_FOR_TESTING || isActuallyLive || isSundayServiceWindow();
}

async function checkYouTubeLiveStatus(){
  if(FORCE_CHAT_OPEN_FOR_TESTING){
    isActuallyLive = true;
    return;
  }

  try{
    const res = await fetch(CHAT_BACKEND_URL + "?action=status&t=" + Date.now());
    const data = await res.json();
    isActuallyLive = !!data.live;
  }catch(err){
    isActuallyLive = isSundayServiceWindow();
  }
}

function updateChat(){
  const open = shouldOpenLiveChat();

  document.getElementById("chatLiveWrap").classList.toggle("vumcHidden", !open);
  document.getElementById("chatClosedWrap").classList.toggle("vumcHidden", open);
}

async function refresh(){
  await checkYouTubeLiveStatus();
  updateChat();
}

refresh();
setInterval(refresh, 60000);
</script>

</body>
</html>
