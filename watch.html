<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VUMC Watch Live</title>

<script src="https://js.churchcenter.com/modal/v1"></script>

<style>
body{
  margin:0;
  background:#0f1115;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

/* LAYOUT */
#vumcShell{
  display:grid;
  grid-template-columns:1fr 420px;
  min-height:100vh;
}

@media(max-width:980px){
  #vumcShell{grid-template-columns:1fr;}
  #vumcSidebar{display:none;}
}

/* PLAYER */
#playerWrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  overflow:hidden;
}

#fallbackImage{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:0;
}

#livePlayer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  z-index:1;
  display:none;
}

/* SIDEBAR */
#vumcSidebar{
  background:#15181f;
}

#vumcSidebarInner{
  padding:16px;
}

.vumcTabs{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.vumcTabBtn{
  flex:1;
  background:#262a33;
  color:#fff;
  padding:12px;
  border-radius:10px;
  border:0;
  font-weight:bold;
  cursor:pointer;
}

.vumcTabBtn.active{
  background:#d4af37;
  color:#111;
}

.vumcTabPane{display:none;}
.vumcTabPane.active{display:block;}

.vumcHidden{display:none!important;}

/* CHAT */
.chatMessages{
  height:300px;
  overflow:auto;
  background:#10131a;
  padding:10px;
}

.chatInputArea{
  padding:10px;
}

.chatInputArea input,
.chatInputArea textarea{
  width:100%;
  margin-bottom:8px;
  padding:10px;
  border-radius:8px;
  border:0;
}

button{
  background:#d4af37;
  color:#111;
  border:0;
  padding:10px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="vumcShell">

<main>
  <div id="playerWrap">

    <!-- FALLBACK IMAGE -->
    <img
      id="fallbackImage"
      src="/media/worship-with-us1.png"
      alt="Worship with us">

    <!-- YOUTUBE PLAYER -->
    <iframe
      id="livePlayer"
      src="https://www.youtube.com/embed/live_stream?channel=UC_svgodM3blLqWEBQ5yNjmA&autoplay=1&mute=1&playsinline=1"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>

  </div>
</main>

<aside id="vumcSidebar">
<div id="vumcSidebarInner">

<div class="vumcTabs">
  <button class="vumcTabBtn active" data-tab="chat">Chat</button>
  <button class="vumcTabBtn" data-tab="notes">Notes</button>
</div>

<div id="tab-chat" class="vumcTabPane active">

  <div id="chatLiveWrap" class="vumcHidden">
    <div id="chatMessages" class="chatMessages"></div>

    <div class="chatInputArea">
      <input id="chatName" placeholder="Your name">
      <textarea id="chatMessage" placeholder="Message"></textarea>
      <button id="sendChatBtn">Send</button>
    </div>
  </div>

  <div id="chatClosedWrap">
    <h3>Chat opens during worship</h3>
  </div>

</div>

<div id="tab-notes" class="vumcTabPane">
  <iframe src="https://sermon.versaillesumc.org" style="width:100%;height:500px;border:0;"></iframe>
</div>

</div>
</aside>

</div>

<script>
const CHAT_BACKEND_URL = "https://script.google.com/macros/s/AKfycbzWN8Xi7xUFa_gjg4XHuD_yEEkaKLwrnXFI8d_XQMW4-KQRUlVPVmxcjfcgC0gMNMewsg/exec";

let isActuallyLive = false;

/* TIME WINDOW */
function isSundayServiceWindow(){
  const now = new Date();
  return now.getDay() === 0 &&
         (now.getHours()*60 + now.getMinutes()) >= 570 &&
         (now.getHours()*60 + now.getMinutes()) <= 720;
}

/* CHAT + PLAYER LOGIC */
function shouldOpenLive(){
  return isActuallyLive || isSundayServiceWindow();
}

/* CHECK LIVE */
async function checkLive(){
  try{
    const res = await fetch(CHAT_BACKEND_URL + "?action=status&t=" + Date.now());
    const data = await res.json();
    isActuallyLive = !!data.live;
  }catch{
    isActuallyLive = false;
  }
}

/* TOGGLE PLAYER */
function updatePlayer(){
  const fallback = document.getElementById("fallbackImage");
  const player = document.getElementById("livePlayer");

  if(shouldOpenLive()){
    fallback.style.display = "none";
    player.style.display = "block";
  }else{
    fallback.style.display = "block";
    player.style.display = "none";
  }
}

/* CHAT UI */
function updateChat(){
  const open = shouldOpenLive();

  document.getElementById("chatLiveWrap").classList.toggle("vumcHidden", !open);
  document.getElementById("chatClosedWrap").classList.toggle("vumcHidden", open);
}

/* LOAD CHAT */
async function loadChat(){
  if(!shouldOpenLive()) return;

  try{
    const res = await fetch(CHAT_BACKEND_URL + "?action=getMessages&t=" + Date.now());
    const data = await res.json();

    const box = document.getElementById("chatMessages");
    box.innerHTML = "";

    (data.messages || []).forEach(m=>{
      const div = document.createElement("div");
      div.style.background="#fff";
      div.style.color="#111";
      div.style.marginBottom="8px";
      div.style.padding="8px";
      div.style.borderRadius="6px";
      div.innerHTML = "<strong>"+(m.name||"Guest")+"</strong>: "+(m.message||"");
      box.appendChild(div);
    });

  }catch{}
}

/* SEND CHAT */
document.getElementById("sendChatBtn").onclick = async ()=>{
  const name = document.getElementById("chatName").value || "Guest";
  const msg = document.getElementById("chatMessage").value;

  if(!msg) return;

  document.getElementById("chatMessage").value = "";

  await fetch(CHAT_BACKEND_URL,{
    method:"POST",
    mode:"no-cors",
    body:JSON.stringify({name, message:msg})
  });

  setTimeout(loadChat,500);
};

/* TABS */
document.querySelectorAll(".vumcTabBtn").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll(".vumcTabBtn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".vumcTabPane").forEach(p=>p.classList.remove("active"));

    btn.classList.add("active");
    document.getElementById("tab-"+btn.dataset.tab).classList.add("active");
  };
});

/* LOOP */
async function refresh(){
  await checkLive();
  updatePlayer();
  updateChat();
  loadChat();
}

refresh();
setInterval(refresh,60000);
setInterval(loadChat,10000);
</script>

</body>
</html>
