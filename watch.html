<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VUMC Watch Live</title>

<script src="https://js.churchcenter.com/modal/v1"></script>

<style>
body{
  margin:0;
  background:#0f1115;
  color:#fff;
  font-family:Arial, Helvetica, sans-serif;
}

#playerWrap{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  overflow:hidden;
}

#playerWrap iframe{
  width:100%;
  height:100%;
  border:0;
  display:block;
}

/* EMERGENCY: KILL ANY OVERLAY INSIDE PLAYER */
#playerOverlay,
.playerOverlay,
#playerWrap > div,
#playerWrap [id*="overlay" i],
#playerWrap [class*="overlay" i]{
  display:none!important;
  opacity:0!important;
  visibility:hidden!important;
  pointer-events:none!important;
  z-index:-1!important;
}

.vumcHidden{display:none!important;}

#chatLiveWrap,
#chatClosedWrap{
  padding:20px;
}

input, textarea{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:0;
}

button{
  background:#d4af37;
  color:#111;
  border:0;
  padding:12px;
  border-radius:8px;
  font-weight:800;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="playerWrap">
  <iframe
    src="https://www.youtube.com/embed/live_stream?channel=UC_svgodM3blLqWEBQ5yNjmA&autoplay=1&mute=1&rel=0&playsinline=1"
    title="Versailles UMC Live"
    allow="autoplay; encrypted-media; picture-in-picture; web-share"
    allowfullscreen>
  </iframe>
</div>

<div id="chatLiveWrap">
  <h2>Live Chat</h2>
  <div id="chatMessages"></div>

  <input id="chatName" type="text" placeholder="Your name">
  <textarea id="chatMessage" placeholder="Type your message..."></textarea>
  <button id="sendChatBtn" type="button">Send Message</button>
</div>

<div id="chatClosedWrap" class="vumcHidden">
  <h2>Chat Opens During Worship</h2>
</div>

<script>
const CHAT_BACKEND_URL = "https://script.google.com/macros/s/AKfycbzWN8Xi7xUFa_gjg4XHuD_yEEkaKLwrnXFI8d_XQMW4-KQRUlVPVmxcjfcgC0gMNMewsg/exec";

function escapeHtml(str){
  return String(str || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

async function loadChatMessages(){
  try{
    const res = await fetch(CHAT_BACKEND_URL + "?action=getMessages&t=" + Date.now());
    const data = await res.json();

    const box = document.getElementById("chatMessages");
    box.innerHTML = "";

    (data.messages || []).forEach(entry=>{
      const div = document.createElement("div");
      div.style.background = "#f5f5f5";
      div.style.color = "#111";
      div.style.padding = "10px";
      div.style.borderRadius = "10px";
      div.style.marginBottom = "10px";
      div.innerHTML =
        "<strong>" + escapeHtml(entry.name || "Guest") + "</strong><br>" +
        escapeHtml(entry.message || "");
      box.appendChild(div);
    });
  }catch(err){}
}

async function sendChatMessage(){
  const name = document.getElementById("chatName").value.trim() || "Guest";
  const message = document.getElementById("chatMessage").value.trim();

  if(!message) return;

  document.getElementById("chatMessage").value = "";

  await fetch(CHAT_BACKEND_URL,{
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({
      action:"postMessage",
      name,
      message,
      role:"guest",
      page:"VUMC Watch Live",
      timestamp:new Date().toISOString()
    })
  });

  setTimeout(loadChatMessages,700);
}

document.getElementById("sendChatBtn").addEventListener("click",sendChatMessage);

document.getElementById("chatMessage").addEventListener("keydown",function(e){
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendChatMessage();
  }
});

loadChatMessages();
setInterval(loadChatMessages,10000);
</script>

</body>
</html>
